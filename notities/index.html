<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Notities | De Samenkomst</title>
<meta name="description" content="Maak notities in mappen, met je eigen tekst en Bijbelverzen op één pagina." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../icon.png?v=bijbel6" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=bijbel6" />
<link rel="manifest" href="../site.webmanifest" />
<meta name="theme-color" content="#3C5E70" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
:root{--ink:#1d2b33;--muted:#6b7a83;--line:#e3e8eb;--paper:#f4f6f7;--accent:#3c5e70;--card:#fff;--bar:calc(92px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.ed{background:#fff}
html:has(body.ed){background:#fff}
[hidden]{display:none!important}
header{background:var(--accent);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:64px}
.top .mid{flex:1;min-width:0;text-align:center;color:#fff}
.top .mid b{display:block;font-size:17px;font-weight:700;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25;word-break:break-word}
.top .mid small{display:block;font-size:13px;opacity:.75}
.tb{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;padding:0}
.tb svg{width:20px;height:20px}
.tb.sp{visibility:hidden}
.dl-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:80}.dl-sh{background:#fff;border-radius:18px 18px 0 0;width:min(520px,100%);padding:16px 18px 22px;box-shadow:0 8px 30px rgba(0,0,0,.16)}.dl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dl-x{width:32px;height:32px;border-radius:50%;border:0;background:#eaeef0;color:#3C5E70;font-size:18px;cursor:pointer}.dl-r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:600}.dl-t{font-size:13px;color:#6b7a83;margin:0 0 10px}.dl-l{width:100%;padding:10px;border:1px solid rgba(29,43,51,.15);border-radius:10px;font-size:13px;margin-bottom:10px}.dl-c{width:100%;padding:12px;border:0;border-radius:10px;background:#3C5E70;color:#fff;font-weight:600;cursor:pointer}
.ed-only{display:none!important}
body.ed .ed-only{display:inline-flex!important}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px calc(var(--bar) + 20px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip svg{width:16px;height:16px;color:var(--muted)}
.chip.on{background:#e7ecef;border-color:#cdd7dc}
.groep{font-size:20px;font-weight:800;margin:20px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kaart{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.kaart .pv{height:150px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;overflow:hidden;position:relative;transition:box-shadow .15s,border-color .15s}
.kaart:hover .pv{border-color:#cbd5da;box-shadow:0 3px 12px rgba(29,43,51,.08)}
.kaart .pv b{display:block;font-size:14px;margin-bottom:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kaart .pv p{margin:0;font-size:12.5px;line-height:1.45;color:#4a5961;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.kaart .pv p.v{color:var(--accent);font-weight:600}
.kaart .pv:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,#fff)}
.kaart .nm{display:block;text-align:center;font-size:14.5px;font-weight:700;margin:9px 4px 1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kaart .dt{display:block;text-align:center;font-size:12.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.leeg{padding:60px 24px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5}
.leeg .ib{width:76px;height:76px;border-radius:24px;background:#e7eef4;color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.leeg .ib svg{width:38px;height:38px}
.leeg b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}
/* zwevende balk onderaan (zoals Apple Notities) */
.fl{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;pointer-events:none}
.fl>*{pointer-events:auto}
.pil{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;border-radius:999px;background:#fff;box-shadow:0 6px 24px rgba(29,43,51,.16);border:1px solid var(--line)}
.pil svg{flex:none;width:22px;height:22px;color:var(--ink)}
.pil input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);outline:none}
.pil button{border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px;cursor:pointer;padding:0;height:100%}
.pil.vers{flex:none}
.rond{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(29,43,51,.16);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.rond svg{width:24px;height:24px}
/* pagina */
.pg{max-width:760px;margin:0 auto;padding:22px 20px calc(var(--bar) + 40px)}
.titel{width:100%;border:0;background:transparent;font:inherit;font-size:32px;font-weight:800;color:var(--ink);outline:none;padding:2px 0;margin:0 0 6px}
.titel::placeholder{color:#c4ccd1}
.meta{color:var(--muted);font-size:13px;margin:0 0 14px}
.body{min-height:calc(100vh - 260px);min-height:calc(100dvh - 260px);outline:none;font-size:18px;line-height:1.65;color:#2b3a43;word-break:break-word}
.body>div{min-height:1.65em;white-space:pre-wrap}
.body:empty:before{content:"Begin met typen…";color:#c4ccd1}
.vb{cursor:pointer;margin:12px 0;padding:14px 16px 12px;background:var(--paper);border-radius:14px;border:1px solid var(--line);position:relative;-webkit-user-select:text;user-select:text;white-space:normal!important}
.vb .r{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.vb .r a{flex:1;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
.vb .r a:hover{text-decoration:underline}
.vb .x{width:28px;height:28px;border-radius:50%;border:0;background:#e5eaed;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0}
.vb .t{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.65;color:var(--ink)}
.vb .t sup{font-family:Inter,system-ui,sans-serif;font-size:.62em;font-weight:700;color:var(--accent);margin-right:.42em}
.vb .t.kort{max-height:9.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.vb .mv{width:28px;height:28px;border-radius:50%;border:0;background:#e5eaed;color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer;margin-left:4px}
.vb .m{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0 0}
/* schermen (zelfde stijl als het versmenu) */
.bg{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:768px){.bg{align-items:center}.sh{border-radius:24px}}
.sh .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh .h b{font-size:18px}
.sh .x{width:36px;height:36px;border-radius:50%;border:0;background:#f0f2f4;color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border:0;border-top:1px solid var(--line);background:none;font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer}
.act:first-of-type{border-top:0}
.act svg{flex:none;width:22px;height:22px;color:var(--accent)}
.act.rood,.act.rood svg{color:#a8402f}
.act small{display:block;color:var(--muted);font-size:13px}
.in{width:100%;height:48px;border-radius:12px;border:1px solid #d5dde1;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none;margin:4px 0 10px}
.in:focus{border-color:var(--accent)}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:1px solid #cdd7dc;background:#eef2f4;color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.hint{color:var(--muted);font-size:13px;margin:8px 2px}
.res{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.rs{display:block;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:10px;font:inherit;color:var(--ink);cursor:pointer}
.rs:hover{background:#f1f4f6}
.rs b{display:block;font-size:15px;color:var(--accent)}
.rs span{display:block;font-size:14px;color:var(--muted);line-height:1.45;margin-top:2px}
.cc{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cc button{border:0;border-radius:999px;background:#eef2f4;padding:0 14px;height:36px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:8px}
.gr button{height:44px;border:0;border-radius:12px;background:#eef2f4;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:1px solid var(--line);padding:12px 18px 12px 14px;border-radius:16px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(29,43,51,.16);width:max-content;max-width:calc(100vw - 32px)}.toast svg{flex:none;width:20px;height:20px;color:var(--accent)}
</style>
</head>
<body>
<header><div class="top"><a class="tb" id="bk" href="/" aria-label="Terug"></a><div class="mid"><b id="kop">Notities</b><small id="sub"></small></div><button class="tb ed-only" id="ud" type="button" aria-label="Ongedaan maken"></button><button class="tb ed-only" id="rd" type="button" aria-label="Opnieuw"></button><button class="tb ed-only" id="sh" type="button" aria-label="Delen"></button><button class="tb" id="mn" type="button" aria-label="Meer"></button></div></header>
<main id="app"></main>
<div class="fl" id="fl"></div>
<script src="/notities-kern.js?v=7"></script>
<script>
(function(){
  function topHref(){try{var r=localStorage.getItem('bible-auth-v1');return r&&JSON.parse(r).user?'/profiel/':'/'}catch(e){return'/'}}
  var N=window.OnkN,E=N.esc,app=document.getElementById('app'),kop=document.getElementById('kop'),sub=document.getElementById('sub'),fl=document.getElementById('fl'),bk=document.getElementById('bk'),mn=document.getElementById('mn');
  function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var I={back:ic('<path d="M15 6l-6 6 6 6"/>'),more:ic('<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>'),search:ic('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
    compose:ic('<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H12M20 11v6.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11"/><path d="M18.5 3.5l2 2-8 8-3 1 1-3z"/>'),
    folder:ic('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),verse:ic('<path d="M3.5 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8.5-.5v13c-2.5-1-5.5-1-8.5.5-3-1.5-6-1.5-8.5-.5z"/><path d="M12 6v13.5"/>'),
    note:N.ICONS.note,trash:ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),edit:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>')};
  var zoekTerm='',aktief='',editId=null,lastIdx=-1;
  function hash(){var m=/^#(n|m)=(.+)$/.exec(location.hash);return m?{k:m[1],id:m[2]}:{k:'',id:''};}
  function go(h){location.hash=h||'';}
  function toast(t){var d=document.createElement('div');d.className='toast';d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span></span>';d.lastChild.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2400);}
  window.addEventListener('hashchange',draw);

  /* ---------- schermen ---------- */
  function scherm(html,onclick){var bg=document.createElement('div');bg.className='bg';bg.innerHTML='<div class="sh" role="dialog">'+html+'</div>';document.body.appendChild(bg);
    function sluit(){bg.remove();}
    bg.addEventListener('click',function(e){if(e.target===bg||e.target.closest('[data-x]')){sluit();return;}if(onclick)onclick(e,sluit,bg);});return {bg:bg,sluit:sluit};}
  function vraag(titel,waarde,knop,cb){var s=scherm('<div class="h"><b>'+E(titel)+'</b><button class="x" type="button" data-x aria-label="Sluiten">×</button></div><input class="in" id="vr" value="'+E(waarde||'')+'" autocomplete="off"><button class="knop" type="button" data-ok>'+E(knop)+'</button>',function(e,sluit,bg){if(e.target.closest('[data-ok]')){var v=bg.querySelector('#vr').value.trim();if(v){sluit();cb(v);}}});var i=s.bg.querySelector('#vr');i.focus();i.select();i.onkeydown=function(ev){if(ev.key==='Enter'){var v=i.value.trim();if(v){s.sluit();cb(v);}}};}
  function acties(titel,lijst){var h='<div class="h"><b>'+E(titel)+'</b><button class="x" type="button" data-x aria-label="Sluiten">×</button></div>'+lijst.map(function(a,i){return '<button class="act'+(a.rood?' rood':'')+'" type="button" data-a="'+i+'">'+a.icon+'<span>'+E(a.t)+(a.s?'<small>'+E(a.s)+'</small>':'')+'</span></button>';}).join('');
    scherm(h,function(e,sluit){var b=e.target.closest('[data-a]');if(b){sluit();lijst[+b.getAttribute('data-a')].fn();}});}
  function bevestig(titel,tekst,knop,cb){scherm('<div class="h"><b>'+E(titel)+'</b><button class="x" type="button" data-x aria-label="Sluiten">×</button></div><p class="hint" style="font-size:15px">'+E(tekst)+'</p><button class="knop" type="button" data-ok style="color:#a8402f">'+E(knop)+'</button>',function(e,sluit){if(e.target.closest('[data-ok]')){sluit();cb();}});}

  /* ---------- overzicht ---------- */
  function dagGroep(t){var d=new Date(t),n=new Date();d.setHours(0,0,0,0);n.setHours(0,0,0,0);var v=Math.round((n-d)/864e5);return v<=0?'Vandaag':v===1?'Gisteren':v<=7?'Afgelopen 7 dagen':v<=30?'Afgelopen 30 dagen':'Eerder';}
  function datum(t){var d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString((OnkEN()?'en-US':'nl-NL'),{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString((OnkEN()?'en-US':'nl-NL'),{day:'numeric',month:'short',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'});}
  function voorbeeld(n){var r=[];for(var i=0;i<n.blocks.length&&r.length<6;i++){var b=n.blocks[i];if(b.t==='text'){if(b.text.trim())r.push('<p>'+E(b.text.trim())+'</p>');}else r.push('<p class="v">'+E(N.label(b))+'</p>');}return r.join('')||'<p>'+(OnkEN()?'Empty note':'Lege notitie')+'</p>';}
  function kaart(n,metMap){var f=N.state().folders.filter(function(x){return x.id===n.folder;})[0];return '<button class="kaart" type="button" data-n="'+n.id+'"><div class="pv"><b>'+E(n.title||OnkUn())+'</b>'+voorbeeld(n)+'</div><span class="nm">'+E(n.title||OnkUn())+'</span><span class="dt">'+E(datum(n.t))+(metMap&&f?' · '+E(f.name):'')+'</span></button>';}
  function overzicht(){
    var s=N.state(),h=hash();aktief=h.k==='m'?h.id:'';var f=s.folders.filter(function(x){return x.id===aktief;})[0];if(h.k==='m'&&!f){go('');return;}
    document.body.classList.remove('ed');bk.innerHTML=I.back;bk.setAttribute('href',f?'#':topHref());bk.onclick=f?function(e){e.preventDefault();go('');}:null;mn.innerHTML=I.more;mn.className='tb';
    var term=zoekTerm.trim().toLowerCase();
    var ns=s.notes.filter(function(n){return !aktief||n.folder===aktief;});
    if(term)ns=ns.filter(function(n){return (n.title||'').toLowerCase().indexOf(term)>=0||n.blocks.some(function(b){return b.t==='text'&&b.text.toLowerCase().indexOf(term)>=0||b.t==='verse'&&N.label(b).toLowerCase().indexOf(term)>=0;});});
    ns.sort(function(a,b){return b.t-a.t;});
    kop.textContent=f?f.name:'Notities';sub.textContent=ns.length+(ns.length===1?' notitie':' notities');
    var o='<div class="wrap">';
    o+='<div class="chips"><button class="chip'+(aktief?'':' on')+'" type="button" data-m="">'+I.note.replace('<svg','<svg style="width:16px;height:16px"')+'Alle notities</button>'+s.folders.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(m){return '<button class="chip'+(m.id===aktief?' on':'')+'" type="button" data-m="'+m.id+'">'+I.folder+E(m.name)+'</button>';}).join('')+'<button class="chip" type="button" data-nm>'+I.plus+'Map</button></div>';
    if(!ns.length){o+='<div class="leeg"><div class="ib">'+I.note+'</div><b>'+(term?'Niets gevonden':'Nog geen notities')+'</b>'+(term?'Probeer een ander woord.':'Maak een notitie, geef hem een titel zoals De doop, en zet er tekst en Bijbelverzen in. Vanuit elk vers kun je kiezen: Toevoegen aan Notities.')+'</div>';}
    else{var groepen={},volg=[];ns.forEach(function(n){var g=dagGroep(n.t);if(!groepen[g]){groepen[g]=[];volg.push(g);}groepen[g].push(n);});
      volg.forEach(function(g){o+='<div class="groep">'+g+'</div><div class="grid">'+groepen[g].map(function(n){return kaart(n,!aktief);}).join('')+'</div>';});}
    app.innerHTML=o+'</div>';
    fl.innerHTML='<label class="pil">'+I.search+'<input id="zoek" type="search" placeholder="Zoek" value="'+E(zoekTerm)+'" autocomplete="off"></label><button class="rond" type="button" data-nn aria-label="Nieuwe notitie">'+I.compose+'</button>';
    var z=document.getElementById('zoek');z.oninput=function(){zoekTerm=z.value;var p=z.selectionStart;overzicht();var z2=document.getElementById('zoek');z2.focus();z2.setSelectionRange(p,p);};
  }
  mn.onclick=function(){var h=hash();
