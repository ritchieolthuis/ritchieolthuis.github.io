    <!-- OAuth return-origin guard: runs before any module loads. If Google/
         Supabase bounced the browser to the wrong origin after sign-in
         (Supabase falls back to its single "Site URL" when redirectTo isn't
         allow-listed), forward the auth tokens back to the page the reader
         actually started from. window.name survives the cross-origin trip.
         Then, once Supabase has consumed the tokens from the hash, strip the
         leftover "#..." (and a bare "#") so the address bar stays clean. -->
    <script>
      (function () {
        try {
          var h = location.hash || "";
          var isAuthHash = /[#&](access_token|refresh_token|provider_token|error|error_description)=/.test(h);
          if (isAuthHash) {
            var MARK = "bible-oauth-return:";
            var n = window.name || "";
            if (n.indexOf(MARK) === 0) {
              var target = n.slice(MARK.length);
              window.name = "";
              var to = null;
              try { to = new URL(target); } catch (e) {}
              if (to && to.origin !== location.origin) {
                location.replace(target + h);
                return;
              }
            }
          }
          // tidy the URL: the Supabase client (detectSessionInUrl) reads the
          // token hash on init and clears it itself, but it can leave a bare
          // "#" behind — and a plain visit can carry a stray "#" too. Strip an
          // empty "#"; never touch a hash that still has real content (that's
          // Supabase's to consume).
          var clean = function () {
            var hh = location.hash || "";
            var bareHash = hh === "#" || (hh === "" && /#$/.test(location.href));
            if (bareHash) history.replaceState(null, "", location.pathname + location.search);
          };
          if (isAuthHash) { setTimeout(clean, 1500); setTimeout(clean, 3500); }
          else { clean(); setTimeout(clean, 100); }
        } catch (e) {}
      })();
    </script>
