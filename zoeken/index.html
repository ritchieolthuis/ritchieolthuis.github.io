    <script>(function(){var b=document.getElementById('ver'),m=document.getElementById('vmenu'),p=new URLSearchParams(location.search),O=['sv','hsv','nbg51','kjv'],L={sv:'SV',hsv:'HSV',nbg51:'NBG',kjv:'KJV'},EN2=(function(){var l=(p.get('lang')||p.get('locale')||'').toLowerCase();if(l==='en')return true;if(l==='nl')return false;try{return (localStorage.getItem('bible-locale')||'').toLowerCase().indexOf('en')===0;}catch(e){return false;}})(),c=O.indexOf(p.get('v'));if(c<0){var dv='';try{dv=(localStorage.getItem('bible-default-version')||'').toLowerCase();}catch(e){}c=O.indexOf(dv);if(c<0)c=EN2?3:0;}b.textContent=L[O[c]];
    [].forEach.call(m.querySelectorAll('button'),function(x){if(x.getAttribute('data-v')===O[c])x.className='on';x.onclick=function(){var n=x.getAttribute('data-v');if(n==='sv'&&!EN2)p.delete('v');else p.set('v',n);location.search=p.toString();};});

<script>
(function(){
  var PER=25;
  var EN=(function(){var p=new URLSearchParams(location.search),l=(p.get('lang')||p.get('locale')||'').toLowerCase();if(l==='en')return true;if(l==='nl')return false;try{return (localStorage.getItem('bible-locale')||'').toLowerCase().indexOf('en')===0;}catch(e){return false;}})();
  function T(nl,en){return EN?en:nl;}
  var NLNAME=[];
  function nT(n){return n+' '+(EN?(n===1?'verse':'verses'):(n===1?'tekst':'teksten'));}
  function ondNm(o){return (EN?o.naam:o.nl).replace(/\\(['"])/g,'$1');}
  var DATA=null, VERSEN=null, TITELS=null, BOEKSLUG=[];
  var state={open:-1,openCh:0,bsort:'bijbel',btest:'alle',bch:'alle',q:'',boek:'',getoond:0,res:null,topGetoond:false,sort:'rel',tab:'bijbel',ondMax:200};
  if(new URLSearchParams(location.search).get('t')==='o')state.tab='onderwerpen';
  var ONDERWERPEN=null;

  function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,;:!?()\[\]"'“”‘’\-–—]/g,' ').replace(/\s+/g,' ').trim().replace(/jez/g,'jes');}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function slug(naam){return norm(naam).replace(/ /g,'-');}

  function laad(){
    var vp=new URLSearchParams(location.search).get('v');
    var dvv='';try{dvv=(localStorage.getItem('bible-default-version')||'').toLowerCase();}catch(e){}
    /* Versie = gekozen in de URL, anders de standaardvertaling van het account, anders SV (NL) of KJV (EN). De taal van de site bepaalt alleen namen en labels. */
    var toon=(vp==='kjv'||vp==='hsv'||vp==='nbg51'||vp==='sv')?vp:((dvv==='kjv'||dvv==='hsv'||dvv==='nbg51'||dvv==='sv')?dvv:(EN?'kjv':'sv'));
    return Promise.all([
      fetch('/data/sv.json').then(function(r){return r.json();}),
      fetch('/data/chapterTitles'+(EN?'-en':'')+'.json').then(function(r){return r.json();}),
      fetch('/data/kjv.json').then(function(r){return r.json();}),
      (toon==='hsv'||toon==='nbg51')?fetch('/data/seo/'+toon+'.json').then(function(r){return r.json();}):Promise.resolve(null)

  function zoek(q){
    var qn=norm(q); if(!qn)return {treffers:[],per:[],tot:0,w:[],laatstePrefix:false};
    var w=qn.split(' ');
    var laatstePrefix=!/\s$/.test(q);
    var fase=[],rest=[];
    var re_esc=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');};
    function past(toks){
      var ok=true;
      for(var i=0;i<w.length&&ok;i++){
        var wi=w[i], isL=(i===w.length-1)&&laatstePrefix, gev=false;
        for(var j=0;j<toks.length;j++){
          if(isL?toks[j].indexOf(wi)===0:toks[j]===wi){gev=true;break;}
        }
        if(!gev)ok=false;
      }
      if(!ok)return null;
      var zin=' '+toks.join(' ')+' ', fraseOk;
      if(laatstePrefix){
        var pre=w.slice(0,-1).map(re_esc).join(' ');
        var re=new RegExp(' '+(pre?pre+' ':'')+re_esc(w[w.length-1])+'[^ ]* ');
        fraseOk=re.test(zin);
      }else{
        fraseOk=zin.indexOf(' '+qn+' ')>=0;
      }
      return {frase:fraseOk};
    }
    VERSEN.forEach(function(v){
      var a=past(v.tok)||(v.tokX&&v.tokX.length?past(v.tokX):false), b=a?null:past(v.tokKjv||[]);
      var m=a||b;
      if(!m)return;
      (m.frase?fase:rest).push(v);
    });
    var treffers=fase.concat(rest);
    var per=[];for(var k=0;k<DATA.length;k++)per[k]=0;
    treffers.forEach(function(v){per[v.bi]++;});
    return {treffers:treffers,per:per,tot:treffers.length,w:w,laatstePrefix:laatstePrefix};
  }

    var m=/^((?:[123]|i{1,3}) ?[a-z]+(?: [a-z]+)*|[a-z]+(?: [a-z]+)*) (\d+)(?: (\d+))?$/.exec(n);
    if(!m)return null;

    }
    var bis=boekenVoor(q);
    bk.innerHTML=bis.length?boekenHtml(bis):'';
    if(res.tot>0)filterHtml(res);else filt.innerHTML='';
    var lijst=res.treffers.filter(function(v){return !state.boek||DATA[v.bi].name===state.boek;});
    var topV=lijst[0];
    if(state.sort!=='rel'){lijst=lijst.slice().sort(function(a,b){return a.tekst.localeCompare(b.tekst,'nl',{sensitivity:'base'});});if(state.sort==='za')lijst.reverse();}
    var tot=lijst.length;
    if(res.tot===0){
      sam.innerHTML=bis.length?'':T('Geen resultaten voor ','No results for ')+'<b>'+esc(q)+'</b>';
      topBlok.innerHTML='';lijstEl.innerHTML='';document.getElementById('versRij').hidden=true;meer.hidden=true;
      leeg.hidden=bis.length>0;leeg.textContent=T('Geen verzen gevonden. Probeer andere woorden.','No verses found. Try other words.');
      return;
    }
    leeg.hidden=true;
    sam.innerHTML='<b>'+tot.toLocaleString(EN?'en-US':'nl-NL')+'</b> '+T('Bijbel-resultaten voor','Bible results for')+' <b>“'+esc(q)+'”</b> '+T('uit','from')+' '+(EN?{sv:'the Statenvertaling (Dutch)',hsv:'the Herziene Statenvertaling (Dutch)',nbg51:'the NBG 1951 (Dutch)',kjv:'the King James Version'}[VERSEN_TOON]:({sv:'de Statenvertaling',hsv:'de Herziene Statenvertaling',nbg51:'de NBG-vertaling 1951',kjv:'de King James Version'}[VERSEN_TOON]||'de Statenvertaling'))+(state.boek?' '+T('in','in')+' '+esc(state.boek):'');
    if(tot===0){topBlok.innerHTML='';lijstEl.innerHTML='<div class="leeg">'+T('Geen treffers in dit boek.','No matches in this book.')+'</div>';document.getElementById('versRij').hidden=true;meer.hidden=true;return;}
    var top=topV;
    document.getElementById('versKop').innerHTML=ikoon('vers')+T('Verzen','Verses');
    topBlok.innerHTML='<p class="kop met-ico">'+ikoon('top')+T('Top resultaat','Top result')+'</p><a class="top-res" href="'+vHref(top)+'"><div class="ref">'+esc(top.ref)+'</div><div class="tekst">'+markeer(top.tekst,res.w,res.laatstePrefix)+'</div></a>';
    document.getElementById('versRij').hidden=false;
    renderTitels(q);
    var einde=Math.max(PER,state.getoond||PER);
    lijstEl.innerHTML=lijst.slice(0,einde).map(function(v){
      return '<a class="rij" href="'+vHref(v)+'"><div class="ref">'+esc(v.ref)+'</div><div class="tekst">'+markeer(v.tekst,res.w,res.laatstePrefix)+'</div></a>';
    }).join('');
    state.getoond=einde;
    meer.hidden=lijst.length<=einde;
  }

  function laadOnderwerpen(){
    if(ONDERWERPEN)return Promise.resolve(ONDERWERPEN);
    return fetch('/data/onderwerpen-nl.json').then(function(r){return r.json();}).then(function(d){
      ONDERWERPEN=d.map(function(o){return {naam:o.name,nl:o.nl,n:o.n,b:o.b||[],zoek:norm(o.nl)+' '+norm(o.name)};});
      return ONDERWERPEN;
    });
  }
  function ondVoor(q){
    var qn=norm(q); if(!ONDERWERPEN)return [];
    if(!qn)return ONDERWERPEN.slice().sort(function(a,b){return b.n-a.n;});
    var woorden=qn.split(' ');
    return ONDERWERPEN.filter(function(o){
      return woorden.every(function(w){return o.zoek.indexOf(w)>=0;});
    }).sort(function(a,b){return b.n-a.n;});
  }
  // Onderwerp-filters: Testament (OT/NT via de boekcodes) en aantal teksten (n).
  function ondIsOT(o){return (o.b||[]).some(function(c){for(var j=0;j<39;j++){if(DATA[j].code===c)return true;}return false;});}
  function ondBoeken(o){return (o.b||[]).filter(function(c,i,a){return a.indexOf(c)===i;}).length;}
  function ondPassend(o,f,m){
    var nb=ondBoeken(o);
    if(f==='b1'&&nb!==1)return false;
    if(f==='b2-5'&&!(nb>=2&&nb<=5))return false;
    if(f==='b6+'&&nb<6)return false;
    if(m==='1-4'&&!(o.n>=1&&o.n<=4))return false;
    if(m==='5-19'&&!(o.n>=5&&o.n<=19))return false;
    if(m==='20+'&&!(o.n>=20))return false;
    return true;
  }
  function filterOnd(lijst){
    var box=document.getElementById('filters');
    var f=state.ofilt||'alle', m=state.omvang||'alle';
    function knop(groep,waarde,label,aantal){
      var on=(groep==='f'?f:m)===waarde;
      return '<button type="button" class="fb'+(on?' on':'')+'" data-groep="'+groep+'" data-waarde="'+waarde+'"><span>'+label+'</span><span class="n">'+aantal+'</span></button>';
    }
    var b1=lijst.filter(function(o){return ondPassend(o,'b1','alle');}).length;
    var b2=lijst.filter(function(o){return ondPassend(o,'b2-5','alle');}).length;
    var b6=lijst.filter(function(o){return ondPassend(o,'b6+','alle');}).length;
    var m1=lijst.filter(function(o){return ondPassend(o,'alle','1-4');}).length;
    var m2=lijst.filter(function(o){return ondPassend(o,'alle','5-19');}).length;
    var m3=lijst.filter(function(o){return ondPassend(o,'alle','20+');}).length;
    box.innerHTML='<h3>Filters</h3>'+
      '<div class="fgroep"><div class="ft">'+T('Aantal boeken','Number of books')+'</div>'+
        knop('f','alle',T('Alles','All'),lijst.length)+knop('f','b1',T('In 1 boek','In 1 book'),b1)+knop('f','b2-5',T('In 2 tot 5 boeken','In 2 to 5 books'),b2)+knop('f','b6+',T('In 6 of meer boeken','In 6 or more books'),b6)+
      '</div>'+
      '<div class="fgroep"><div class="ft">'+T('Aantal teksten','Number of verses')+'</div>'+
        knop('m','alle',T('Alles','All'),lijst.length)+knop('m','1-4',T('1 tot 4 teksten','1 to 4 verses'),m1)+knop('m','5-19',T('5 tot 19 teksten','5 to 19 verses'),m2)+knop('m','20+',T('20 of meer','20 or more'),m3)+
      '</div>';
    box.querySelectorAll('.fb').forEach(function(b){
      b.onclick=function(){
        if(b.getAttribute('data-groep')==='f')state.ofilt=b.getAttribute('data-waarde');
        else state.omvang=b.getAttribute('data-waarde');
        renderOnd();
      };
    });
  }
  function renderOnd(){
    var q=state.q;
    var sam=document.getElementById('samenvat');
    var topBlok=document.getElementById('topBlok');
    var lijstEl=document.getElementById('lijst');
    var meer=document.getElementById('meer');
    var leeg=document.getElementById('leeg');
    var bk=document.getElementById('boekenBlok');
    var filt=document.getElementById('filters');
    var rij=document.getElementById('versRij');
    topBlok.innerHTML='';bk.innerHTML='';rij.hidden=true;meer.hidden=true;leeg.hidden=true;
    laadOnderwerpen().then(function(){
      var alle=ondVoor(q.trim());
      if(!alle.length){
        sam.innerHTML=T('Geen onderwerpen gevonden voor ','No topics found for ')+'<b>'+esc(q)+'</b>';
        lijstEl.innerHTML='';filt.innerHTML='';
        leeg.hidden=false;leeg.textContent=T('Probeer een ander woord, bijvoorbeeld een stamwoord zoals bid of gebed.','Try another word, for example a root word such as pray or prayer.');
        return;
      }
      filterOnd(alle);
      var lijst=alle.filter(function(o){return ondPassend(o,state.ofilt||'alle',state.omvang||'alle');});
      lijst=lijst.slice();
      if(state.sort==='az')lijst.sort(function(a,b){return ondNm(a).localeCompare(ondNm(b),EN?'en':'nl',{sensitivity:'base'});});
      else if(state.sort==='za')lijst.sort(function(a,b){return ondNm(b).localeCompare(ondNm(a),EN?'en':'nl',{sensitivity:'base'});});
      else lijst.sort(function(a,b){return b.n-a.n;});
      sam.innerHTML='<b>'+lijst.length.toLocaleString(EN?'en-US':'nl-NL')+'</b> '+(q.trim()?T('onderwerpen voor','topics for')+' <b>“'+esc(q)+'”</b>':T('onderwerpen','topics'));
      var rowOnd=document.getElementById('versRij');
      rowOnd.hidden=false;
      document.getElementById('versKop').innerHTML=ikoon('ond')+T('Onderwerpen','Topics');
      var top=q.trim()?lijst[0]:null;
      topBlok.innerHTML=top?'<p class="kop met-ico">'+ikoon('top')+T('Top resultaat','Top result')+'</p><a class="top-res topond" href="/onderwerpen/?onderwerp='+encodeURIComponent(top.naam)+'"><div class="ref">'+esc(ondNm(top))+'</div><div class="tekst">'+nT(top.n)+'</div></a>':'';
      var mx=state.ondMax||200;meer.hidden=lijst.length<=mx;
      lijstEl.innerHTML='<div class="ondlijst">'+lijst.slice(0,mx).map(function(o){
        return '<a class="ond" href="/onderwerpen/?onderwerp='+encodeURIComponent(o.naam)+'"><span class="nl">'+esc(ondNm(o))+'</span><span class="n">'+nT(o.n)+'</span></a>';
      }).join('')+'</div>';
    });
  }
  function zetTab(t){
    state.tab=t;
    document.getElementById('tabBijbel').classList.toggle('on',t==='bijbel');
    document.getElementById('tabOnd').classList.toggle('on',t==='onderwerpen');
    zetUrl();
    if(t==='onderwerpen')renderOnd();else render();
  }

  function zetUrl(){
    var par=[];if(state.q.trim())par.push('q='+encodeURIComponent(state.q));if(state.tab==='onderwerpen')par.push('t=o');
    var v=new URLSearchParams(location.search).get('v');if(v)par.push('v='+encodeURIComponent(v));
    history.replaceState(null,'','/zoeken/'+(par.length?'?'+par.join('&'):''));
  }
  function zet(q){
    state.q=q;state.open=-1;state.openCh=0;state.boek='';state.ofilt='alle';state.omvang='alle';state.getoond=PER;state.ondMax=200;
    state.res=q.trim()?zoek(q.trim()):null;
    if(state.res&&!/\s$/.test(q))state.res=zoek(q);
    zetUrl();
    document.title=(q.trim()?'“'+q.trim()+'” | ':'')+T('Zoeken in de Bijbel','Search the Bible')+' | De Samenkomst';
    if(state.tab==='onderwerpen')renderOnd();else render();
  }

  var EMBED=new URLSearchParams(location.search).get('embed')==='1';
  if(EMBED){
    document.documentElement.classList.add('embed');
    document.head.insertAdjacentHTML('beforeend','<base target="_top">');
  }
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin||!e.data||e.data.type!=='zoek')return;
    document.getElementById('q').value=e.data.q;
    zet(e.data.q);
  });
  var inp=document.getElementById('q');
  inp.addEventListener('input',function(){
    if(!VERSEN)return;
    zet(inp.value);
  });
  document.getElementById('zoekform').addEventListener('submit',function(e){
    e.preventDefault();
    zet(inp.value);
  });
  document.getElementById('tabBijbel').addEventListener('click',function(){zetTab('bijbel');});
  document.getElementById('tabOnd').addEventListener('click',function(){zetTab('onderwerpen');});
  document.querySelectorAll('.sorteer button').forEach(function(b){
    b.addEventListener('click',function(){
      state.sort=b.getAttribute('data-s');
      document.querySelectorAll('.sorteer button').forEach(function(x){x.classList.toggle('on',x===b);});
      if(state.tab==='onderwerpen')renderOnd();else render();
    });
  });
  document.getElementById('meer').addEventListener('click',function(){
    if(state.tab==='onderwerpen'){state.ondMax=(state.ondMax||200)+200;renderOnd();return;}
    state.getoond=(state.getoond||PER)+PER;
    render();
  });

  if(EN){
    document.documentElement.lang='en';
    document.title='Search the Bible | De Samenkomst';
    var sT=function(sel,txt,attr){var e=document.querySelector(sel);if(!e)return;if(attr)e.setAttribute(attr,txt);else e.textContent=txt;};
    sT('#q','Search the Bible…','placeholder');sT('#q','Search the Bible','aria-label');
    sT('#zoekform button[type=submit]','Search','aria-label');
    sT('#tabBijbel','Bible');sT('#tabOnd','Topics');sT('#samenvat','Loading…');
    sT('#meer','More results');sT('.sorteer','Sort','aria-label');
    sT('.sorteer button[data-s=rel]','Relevance');
    sT('#filters','Filters','aria-label');sT('.logo img','Bible Online','alt');
    sT('#ver','Choose translation','aria-label');
  }
  var start=new URLSearchParams(location.search).get('q')||'';
  inp.value=start;
  laad().then(function(){
    document.getElementById('tabBijbel').classList.toggle('on',state.tab!=='onderwerpen');
    document.getElementById('tabOnd').classList.toggle('on',state.tab==='onderwerpen');
    zet(start);
  }).catch(function(){
    document.getElementById('samenvat').textContent=T('De zoekgegevens konden niet worden geladen.','The search data could not be loaded.');
  });
})();
</script>
<script>(function(){try{var q=new URLSearchParams(location.search).get('q');if(!q||!q.trim())return;q=q.trim();var L=(localStorage.getItem('bible-locale')||document.documentElement.lang||'nl').toLowerCase().indexOf('en')===0?'en':'nl';var K='onk-recent-'+L,T='onk-zoekteller-'+L;var r=JSON.parse(localStorage.getItem(K)||'[]');if(r[0]!==q){r=r.filter(function(x){return x!==q;});r.unshift(q);localStorage.setItem(K,JSON.stringify(r.slice(0,6)));var t=JSON.parse(localStorage.getItem(T)||'{}');t[q]=(t[q]||0)+1;localStorage.setItem(T,JSON.stringify(t));}}catch(e){}})();</script>
<script>(function(){try{
  /* Zelfde zoekbalk als Home: tik in de lege balk = recente en populaire zoekopdrachten onder de balk */
  var f=document.getElementById('zoekform'),q=document.getElementById('q');if(!f||!q)return;
  var L=(localStorage.getItem('bible-locale')||document.documentElement.lang||'nl').toLowerCase().indexOf('en')===0?'en':'nl';
  function tx(nl,en){return L==='en'?en:nl;}
  function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  var box=document.createElement('div');box.className='zp';box.hidden=true;f.appendChild(box);
  function recent(){try{return JSON.parse(localStorage.getItem('onk-recent-'+L)||'[]');}catch(e){return [];}}
  function pop(){try{var c=JSON.parse(localStorage.getItem('onk-pop-'+L)||'null');return c&&Array.isArray(c.l)?c.l.slice(0,5):[];}catch(e){return [];}}
  var HIST='<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>';
  var FLAME='<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>';
  function rij(t,p){return '<button type="button" class="zp-r" data-q="'+esc(t)+'"><span class="zp-i"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg></span><span>'+esc(t)+'</span></button>';}
  function toon(){
    if(q.value.trim()){box.hidden=true;return;}
    var P=pop(),R=recent(),h='';
    if(P.length)h+='<div class="zp-k">'+tx('Populaire zoekopdrachten','Popular searches')+'</div>'+P.map(function(t){return rij(t,FLAME);}).join('');
    if(R.length)h+='<div class="zp-k zp-rij"><span>'+tx('Recente zoekopdrachten','Recent searches')+'</span><button type="button" class="zp-w">'+tx('Verwijderen','Clear')+'</button></div>'+R.map(function(t){return rij(t,HIST);}).join('');
    if(!h){box.hidden=true;return;}
    box.innerHTML=h;box.hidden=false;
  }
  q.addEventListener('focus',toon);
  q.addEventListener('click',toon);
  q.addEventListener('input',function(){if(q.value.trim())box.hidden=true;else toon();});
  q.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==q)box.hidden=true;},180);});
  box.addEventListener('mousedown',function(e){e.preventDefault();});
  box.addEventListener('click',function(e){
    var w=e.target.closest('.zp-w');
    if(w){try{localStorage.removeItem('onk-recent-'+L);}catch(x){}toon();return;}
    var b=e.target.closest('[data-q]');if(!b)return;
    q.value=b.getAttribute('data-q');box.hidden=true;
    q.dispatchEvent(new Event('input',{bubbles:true}));q.focus();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')box.hidden=true;});
  /* vergrootglas links in de balk: focus de balk */
  var ic=f.querySelector('svg');if(ic){ic.style.cursor='text';ic.addEventListener('click',function(){q.focus();});}
}catch(err){}})();</script>
