<!doctype html>
<html lang="nl">
<head>
<script src="/onk-id.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accountinstellingen | De Bijbel - De Samenkomst</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f6f7;--card:#ffffff;--ink:#1d2b33;--muted:#6b7a83;--line:#e3e8eb;--accent:#3c5e70;--hdr:#3c5e70;--chip:#eef2f4;--sel:#dfe6ea;--on:#ffffff}
:root[data-mode="dark"]{--bg:#111315;--card:#1c1f22;--ink:#eef2f4;--muted:#9aa5ad;--line:#2b3035;--accent:#8fb3c4;--hdr:#1c2a32;--chip:#262b30;--sel:#33393f;--on:#111315}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
header{background:var(--hdr);color:#fff;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 16px}
.bar img{height:28px;width:auto;display:block}
.bar a{color:#fff;text-decoration:none;font-size:14px;font-weight:500;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px}
main{max-width:640px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px 10px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.row:first-of-type{border-top:0}
.row .d{display:block;color:var(--muted);font-size:13px}
.row .chk{color:var(--accent);font-weight:600}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.seg button{flex:1;height:40px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.seg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.row[aria-checked="true"] .sw{background:var(--accent)}
.row[aria-checked="true"] .sw::after{left:21px}
@media (min-width:760px){main{max-width:680px}}
</style>
<style>html.embed header{display:none}html.embed main{padding-top:8px}</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");</script>
</head>
<body>
<header>
  <div class="bar">
    <a href="/" style="border:0;padding:0"><img src="../img/brand/bijbel-online-logo.webp" alt="Bijbel Online"></a>
    <a href="/" id="terug">Terug naar de Bijbel</a>
  </div>
</header>
<main>
  <h1 id="titel">Accountinstellingen</h1>
  <p class="sub" id="sub">Instellingen gelden meteen op de hele site en worden in je account bewaard als je bent ingelogd.</p>

  <div class="card" id="profiel" hidden style="text-align:center;padding:24px 18px">
    <img id="p-foto" alt="" width="96" height="96" style="width:96px;height:96px;border-radius:50%;object-fit:cover;display:none;margin:0 auto 12px">
    <div id="p-naam" style="font-size:20px;font-weight:600;margin:0 0 4px"></div>
    <div id="p-mail" style="color:var(--muted);font-size:15px;margin-bottom:14px"></div>
    <input id="p-invoer" type="text" maxlength="40" style="width:100%;max-width:320px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)">
    <div style="margin-top:10px"><button id="p-opslaan" type="button" style="padding:10px 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer">Opslaan</button> <span id="p-melding" style="font-size:14px;color:var(--muted);margin-left:8px"></span></div>
  </div>
  <div class="card">
    <h2 id="h-taal">Taal</h2>
    <div class="seg" role="group" aria-labelledby="h-taal">
      <button type="button" data-locale="nl" aria-pressed="false">Nederlands</button>
      <button type="button" data-locale="en" aria-pressed="false">English</button>
    </div>
  </div>

  <div class="card">
    <h2 id="h-vers">Standaardvertaling</h2>
    <div role="radiogroup" aria-labelledby="h-vers" id="vers"></div>
  </div>

  <div class="card">
    <h2 id="h-lees">Leesinstellingen</h2>
    <div id="lees"></div>
  </div>

</main>

<script>
(function(){
  var NL={qr:'QR-code',qrT:'Scan deze code om De Bijbel op een ander apparaat te openen.',titel:'Accountinstellingen',sub:'Instellingen gelden meteen op de hele site en worden in je account bewaard als je bent ingelogd.',terug:'Terug naar de Bijbel',taal:'Taal',vers:'Standaardvertaling',lees:'Leesinstellingen',weer:'Weergave',licht:'Licht',donker:'Donker',
    volg:'Volg de taal',kjv:'KJV',sv:'Statenvertaling',hsv:'Herziene Statenvertaling',nbg51:'NBG-vertaling 1951',
    kant:'Kanttekeningen',kantD:'De kanttekeningen bij de Statenvertaling.',mark:'Markeringen tonen',markD:'Toont je bewaarde markeringen op de tekst.',
    rood:'Rode letters',roodD:'Woorden van Jezus in rood.',oneind:'Oneindig scrollen',oneindD:'Het volgende hoofdstuk opent vanzelf.',lijnen:'Leeslijn',lijnenD:'Een lijn die meeloopt tijdens het lezen.',opsl:'Opslaan',vul:'Vul een naam in.',bezig:'Bezig...',opg:'Opgeslagen.',nietal:'Niet overal opgeslagen. Probeer opnieuw.',mis:'Opslaan lukte niet.',merk:'De Bijbel'};
  var EN={qr:'QR code',qrT:'Scan this code to open De Bijbel on another device.',titel:'Account settings',sub:'Settings apply to the whole site right away and are saved to your account when you are signed in.',terug:'Back to the Bible',taal:'Language',vers:'Default translation',lees:'Reading settings',weer:'Appearance',licht:'Light',donker:'Dark',
    volg:'Follow the language',kjv:'KJV',sv:'Statenvertaling',hsv:'Revised Statenvertaling',nbg51:'NBG translation 1951',
    kant:'Margin notes',kantD:'The margin notes on the Statenvertaling.',mark:'Show highlights',markD:'Shows your saved highlights in the text.',
    rood:'Red letters',roodD:'The words of Jesus in red.',oneind:'Infinite scroll',oneindD:'The next chapter opens by itself.',lijnen:'Reading line',lijnenD:'A line that moves along while you read.',opsl:'Save',vul:'Enter a name.',bezig:'Working...',opg:'Saved.',nietal:'Not saved everywhere. Try again.',mis:'Saving failed.',merk:'The Bible'};
  var L=NL;
  var MEM={};
  function get(k,d){if(Object.prototype.hasOwnProperty.call(MEM,k))return MEM[k];try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
  function set(k,v){MEM[k]=v;try{localStorage.setItem(k,v);var p={};try{p=JSON.parse(localStorage.getItem('bible-settings-pending')||'{}')||{}}catch(e){}p[k]=v;localStorage.setItem('bible-settings-pending',JSON.stringify(p))}catch(e){}}
  var locale=get('bible-locale','nl')==='en'?'en':'nl';
  function t(){L=locale==='en'?EN:NL;document.documentElement.lang=locale;
    document.getElementById('titel').textContent=L.titel;document.getElementById('sub').textContent=L.sub;
    document.getElementById('terug').textContent=L.terug;try{var _r=localStorage.getItem('bible-auth-v1');if(_r&&JSON.parse(_r).user){var _t=document.getElementById('terug');_t.textContent=(locale==='en'?'Back to profile':'Terug naar profiel');_t.setAttribute('href','/profiel/')}}catch(e){}document.title=L.titel+' | '+L.merk+' - De Samenkomst';var _o=document.getElementById('p-opslaan');if(_o)_o.textContent=L.opsl;
    document.getElementById('h-taal').textContent=L.taal;document.getElementById('h-vers').textContent=L.vers;document.getElementById('h-lees').textContent=L.lees;
    var lb=document.querySelectorAll('[data-locale]');for(var i=0;i<lb.length;i++)lb[i].setAttribute('aria-pressed',String(lb[i].getAttribute('data-locale')===locale));
    vers();lees();}
  function vers(){var cur=get('bible-default-version','');var el=document.getElementById('vers');el.innerHTML='';
    var opts=[['',L.volg],['sv',L.sv],['hsv',L.hsv],['nbg51',L.nbg51],['kjv',L.kjv]];
    opts.forEach(function(o){var b=document.createElement('button');b.type='button';b.className='row';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(cur===o[0]));
      var s=document.createElement('span');s.textContent=o[1];b.appendChild(s);
      var r=document.createElement('span');if(cur===o[0]){r.className='chk';r.textContent='✓'}else if(o[0]===''){r.className='d';r.textContent=(locale==='en'?'KJV':'SV')}b.appendChild(r);
      b.onclick=function(){set('bible-default-version',o[0]);vers();};el.appendChild(b);});}
  var SW=[['bible-kanttekeningen',false,L.kant,L.kantD],['bible-show-highlights',true,L.mark,L.markD],['bible-red-letters',true,L.rood,L.roodD],['bible-infinite-scroll-v2',false,L.oneind,L.oneindD],['bible-reading-lines',false,L.lijnen,L.lijnenD]];
  function isOn(s){var v=get(s[0],s[1]?'on':'off');return s[1]?v!=='off':v==='on'}
  function lees(){SW[0][2]=L.kant;SW[0][3]=L.kantD;SW[1][2]=L.mark;SW[1][3]=L.markD;SW[2][2]=L.rood;SW[2][3]=L.roodD;SW[3][2]=L.oneind;SW[3][3]=L.oneindD;SW[4][2]=L.lijnen;SW[4][3]=L.lijnenD;var el=document.getElementById('lees');el.innerHTML='';
    SW.forEach(function(s){var on=isOn(s);var b=document.createElement('button');b.type='button';b.className='row';b.setAttribute('role','switch');b.setAttribute('aria-checked',String(on));
      var w=document.createElement('span');var n=document.createElement('span');n.textContent=s[2];var d=document.createElement('span');d.className='d';d.textContent=s[3];w.appendChild(n);w.appendChild(d);
      var sw=document.createElement('span');sw.className='sw';sw.setAttribute('aria-hidden','true');b.appendChild(w);b.appendChild(sw);
      b.onclick=function(){set(s[0],on?'off':'on');lees();};el.appendChild(b);});}
  var lb=document.querySelectorAll('[data-locale]');
  for(var i=0;i<lb.length;i++)lb[i].onclick=function(){locale=this.getAttribute('data-locale');set('bible-locale',locale);t();};
  var SB='https://vodswfyhlwvhhkqewtap.supabase.co',PK='sb_publishable_TWZO4LBJZCVPuXG9pAknyA_7gxtFNfu';
  var SESS=null;
  function sessie(){try{var raw=localStorage.getItem('bible-auth-v1')||localStorage.getItem('sb-vodswfyhlwvhhkqewtap-auth-token');return raw?JSON.parse(raw):null}catch(e){return null}}
  function hdr(tok){return {apikey:PK,Authorization:'Bearer '+tok,'Content-Type':'application/json'}}
  function profiel(){SESS=sessie();if(!SESS||!SESS.user||!SESS.access_token)return;var uid=SESS.user.id,tok=SESS.access_token;
    document.getElementById('profiel').hidden=false;
    document.getElementById('p-mail').textContent=SESS.user.email||'';
    Promise.all([
      fetch(SB+'/rest/v1/bible_forum_profile?select=avatar_url,display_name&user_id=eq.'+uid,{headers:hdr(tok)}).then(function(r){return r.json()}).catch(function(){return []}),
      fetch(SB+'/rest/v1/bible_profiles?select=display_name,username&user_id=eq.'+uid,{headers:hdr(tok)}).then(function(r){return r.json()}).catch(function(){return []})
    ]).then(function(res){var fp=(res[0]&&res[0][0])||{},bp=(res[1]&&res[1][0])||{};
      var naam=fp.display_name||bp.display_name||bp.username||(SESS.user.user_metadata&&SESS.user.user_metadata.full_name)||SESS.user.email||'';
      document.getElementById('p-naam').textContent=naam;document.getElementById('p-invoer').value=naam;
      if(fp.avatar_url){var f=document.getElementById('p-foto');f.src=fp.avatar_url;f.style.display='block'}});
    document.getElementById('p-opslaan').onclick=function(){var nw=document.getElementById('p-invoer').value.trim();var m=document.getElementById('p-melding');
      if(!nw){m.textContent=L.vul;return}
      m.textContent=L.bezig;
      Promise.all([
        fetch(SB+'/rest/v1/bible_profiles?user_id=eq.'+uid,{method:'PATCH',headers:Object.assign({Prefer:'return=minimal'},hdr(tok)),body:JSON.stringify({display_name:nw})}),
        fetch(SB+'/rest/v1/bible_forum_profile?user_id=eq.'+uid,{method:'PATCH',headers:Object.assign({Prefer:'return=minimal'},hdr(tok)),body:JSON.stringify({display_name:nw})})
      ]).then(function(rs){if(rs[0].ok&&rs[1].ok){document.getElementById('p-naam').textContent=nw;try{localStorage.setItem('onk-account-name',nw);window.dispatchEvent(new Event('onk-name-changed'))}catch(e){}try{if(window.parent!==window)window.parent.postMessage({onkName:nw},location.origin)}catch(e){}m.textContent=L.opg}else{m.textContent=L.nietal}}).catch(function(){m.textContent=L.mis})};
  }
  profiel();
  t();
})();
</script>
</body>
</html>
