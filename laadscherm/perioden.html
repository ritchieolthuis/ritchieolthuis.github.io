<style>body{margin:0;padding:20px;font:14px -apple-system,Helvetica,Arial,sans-serif;background:#f5f6f8;color:#1c2733}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:#51606e}table{border-collapse:collapse;width:100%;max-width:980px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(20,40,70,.08)}th,td{padding:7px 10px;text-align:left;border-bottom:1px solid #e8ecf0;white-space:nowrap}th{background:#eef2f6;font-weight:600}tr.nu td{background:#fff7d6}.k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}a{color:#2c6a9a}@media(max-width:700px){table{display:block;overflow-x:auto}}</style>
<h1>Perioden van de laadschermen</h1><p>Berekend uit Pasen, dus het gaat door na elk jaar. Pasen: Goede Vrijdag tot de woensdag voor Hemelvaart. Hemelvaart: Hemelvaartsdag tot zaterdag voor Pinksteren. Pinksteren: Pinksterweek. Advent: 1e adventszondag t/m 24 dec. Kerst: 25 dec t/m 6 jan. <a href="index.html">Terug</a></p>
<table id=t></table><script src="periode.js"></script><script>
var N={advent:["Advent","#3a3f8c"],kerst:["Kerst","#5fa4d2"],pasen:["Pasen","#8ec59a"],hemel:["Hemelvaart","#3a86d8"],pink:["Pinksteren","#b92a2d"]};
function f(d){return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}
var cy=new Date().getFullYear(),end=Math.max(2050,cy+24),h="<tr><th>Jaar</th>"+["pasen","hemel","pink","advent","kerst"].map(function(k){return "<th><span class=k style='background:"+N[k][1]+"'></span>"+N[k][0]+"</th>"}).join("")+"</tr>";
for(var y=Math.min(2026,cy);y<=end;y++){var P=window.onkPerioden(y),by={};P.forEach(function(p){by[p.k]=p});h+="<tr"+(y==cy?" class=nu":"")+"><td><b>"+y+"</b></td>"+["pasen","hemel","pink","advent","kerst"].map(function(k){return "<td>"+f(by[k].van)+" - "+f(by[k].tot)+"</td>"}).join("")+"</tr>"}
document.getElementById("t").innerHTML=h;</script></html>
